<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Outer Dark Ring -->
  <rect width="48" height="48" rx="14" fill="#09090b" />
  <rect x="0.5" y="0.5" width="47" height="47" rx="13.5" stroke="#27272a" />
  
  <!-- Outer Orbital Ring -->
  <circle cx="24" cy="24" r="16" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="3 3" />
  
  <!-- Active Arc (T-Minus Progress) -->
  <path d="M 24 8 A 16 16 0 0 1 40 24" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Cardinal Tick Marks -->
  <line x1="24" y1="4" x2="24" y2="7" stroke="#71717a" stroke-width="1.5" stroke-linecap="round" />
  <line x1="44" y1="24" x2="41" y2="24" stroke="#71717a" stroke-width="1.5" stroke-linecap="round" />
  <line x1="24" y1="44" x2="24" y2="41" stroke="#71717a" stroke-width="1.5" stroke-linecap="round" />
  <line x1="4" y1="24" x2="7" y2="24" stroke="#71717a" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Center Core Hub -->
  <circle cx="24" cy="24" r="7" fill="#18181b" stroke="#52525b" stroke-width="1.5" />
  
  <!-- Center Active Beacon -->
  <circle cx="24" cy="24" r="3" fill="#f97316" />
</svg>
